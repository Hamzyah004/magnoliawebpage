<section class="section section--soft" style="min-height: calc(100vh - 160px); display: flex; align-items: center; padding: 40px 0;">
  <div class="container" style="max-width: 440px;">
    <div class="card" style="padding: 36px 28px; background: #ffffff; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--line); text-align: center;">
      
      <!-- Icon -->
      <div style="background: rgba(201, 162, 74, 0.12); width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: var(--gold);">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1 class="h2" style="font-size: 1.45rem; margin-bottom: 6px; color: var(--navy);">Nova Lozinka</h1>
      <p class="muted" style="font-size: 0.9rem; margin: 0 auto 22px; line-height: 1.5;">
        Postavite novu lozinku za vaš Magnolia nalog.
      </p>

      <div id="reset-alert" style="display: none; padding: 12px 16px; border-radius: 12px; margin-bottom: 18px; font-size: 0.9rem; line-height: 1.45; text-align: left;"></div>

      <form id="reset-pwd-form" novalidate style="text-align: left;">
        <div class="auth-field" style="margin-bottom: 16px;">
          <label for="reset-password-input" style="display: block; font-size: 0.88rem; font-weight: 600; color: var(--navy); margin-bottom: 6px;">Nova lozinka (min. 6 znakova)</label>
          <div style="position: relative;">
            <input type="password" id="reset-password-input" required minlength="6" placeholder="Unesite novu lozinku" autocomplete="new-password"
                   style="width: 100%; padding: 12px 42px 12px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 16px; outline: none; transition: border-color 0.2s;">
            <button type="button" class="pwd-toggle" data-target="reset-password-input" aria-label="Prikaži lozinku"
                    style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px;">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="auth-field" style="margin-bottom: 22px;">
          <label for="reset-confirm-input" style="display: block; font-size: 0.88rem; font-weight: 600; color: var(--navy); margin-bottom: 6px;">Potvrdite novu lozinku</label>
          <div style="position: relative;">
            <input type="password" id="reset-confirm-input" required minlength="6" placeholder="Ponovite novu lozinku" autocomplete="new-password"
                   style="width: 100%; padding: 12px 42px 12px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 16px; outline: none; transition: border-color 0.2s;">
            <button type="button" class="pwd-toggle" data-target="reset-confirm-input" aria-label="Prikaži lozinku"
                    style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px;">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="reset-submit-btn" class="btn btn--primary" style="width: 100%; padding: 14px; font-size: 1rem;">
          Ažuriraj lozinku
        </button>
      </form>

    </div>
  </div>
</section>
